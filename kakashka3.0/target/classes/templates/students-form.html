<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить студента</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; }
        label { display: block; margin-top: 12px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 6px; box-sizing: border-box;
        }
        button { margin-top: 15px; padding: 8px 20px; background: #4CAF50;
                 color: white; border: none; border-radius: 4px; cursor: pointer; }
        a { display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>
<h1>Добавить студента</h1>

<form th:action="@{/students/add}" th:object="${student}" method="post">
    <label>Имя:</label>
    <input type="text" th:field="*{name}" required/>

    <label>Курс:</label>
    <input type="number" th:field="*{course}" min="1" max="6" required/>

    <label>
        <input type="checkbox" th:field="*{hasDebt}"/> Есть долг
    </label>

    <button type="submit">Сохранить</button>
    <a th:href="@{/students}">Назад к списку</a>
</form>
</body>
</html>
