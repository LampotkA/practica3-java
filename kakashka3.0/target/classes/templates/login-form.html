<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 80px auto; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 8px 20px; background: #4CAF50;
                 color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: #c62828; margin-top: 10px; }
        a { display: inline-block; margin-top: 12px; }
    </style>
</head>
<body>
<h1>Вход в систему</h1>

<form th:action="@{/login}" method="post">
    <label>Логин:</label>
    <input type="text" name="username" required/>

    <label>Пароль:</label>
    <input type="password" name="password" required/>

    <button type="submit">Войти</button>
</form>

<div class="error" th:if="${error != null}" th:text="${error}"></div>

<a th:href="@{/register}">Нет аккаунта? Зарегистрироваться</a>
</body>
</html>
