<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
        .btn { display: inline-block; margin-top: 15px; padding: 8px 16px;
               background: #4CAF50; color: white; text-decoration: none;
               border-radius: 4px; }
        .btn-logout { float: right; background: #f44336; }
        .yes { color: #c62828; font-weight: bold; }
        .no { color: #2e7d32; font-weight: bold; }
        .empty { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
<h1>Список студентов</h1>
<p>Вы вошли как: <b th:text="${user}"></b>
   <a class="btn btn-logout" th:href="@{/logout}">Выйти</a></p>

<table>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Курс</th>
        <th>Долг</th>
    </tr>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.course}"></td>
        <td>
            <span th:class="${student.hasDebt} ? 'yes' : 'no'"
                  th:text="${student.hasDebt} ? 'Есть' : 'Нет'"></span>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="4" class="empty">Студентов пока нет</td>
    </tr>
</table>

<a class="btn" th:href="@{/students/add}">Добавить студента</a>
</body>
</html>
